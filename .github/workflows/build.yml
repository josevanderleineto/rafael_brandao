# GitHub Actions workflow para build, lint e deploy na Vercel
# Faz deploy automático na Vercel ao fazer push na branch main

name: build-and-deploy

# Dispara o workflow quando houver push na branch main
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      # Faz checkout do repositório
      - name: Checkout
        uses: actions/checkout@v4

      # Instala Node.js e habilita cache do npm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # Instala dependências do projeto
      - name: Install dependencies
        run: npm ci

      # Verifica lint
      - name: Lint
        run: npm run lint || true

      # Executa o build para garantir que não há erros de compilação
      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: build
    # Só faz deploy quando for push na main (não em pull requests)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
